name: Check reservation availability

on:
  schedule:
    # GitHub's cron floor is 5 minutes and it commonly lags another 5-15, which
    # is too slow: a table can be gone before the next tick. So each run instead
    # stays alive and polls on its own clock (see --watch), and the schedule just
    # keeps a watcher running. Runs slightly overlap so coverage is continuous.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push instead of checking availability"
        type: boolean
        default: false

# Prevent two overlapping runs from racing to commit state.json.
concurrency:
  group: reservation-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_TOPIC: ${{ secrets.APNS_TOPIC }}
      APNS_DEVICE_TOKENS: ${{ secrets.APNS_DEVICE_TOKENS }}
      APNS_ENV: ${{ vars.APNS_ENV || 'sandbox' }}
      # Search criteria live in a secret, not in the repo: this is a public
      # repo and the venue plus date range would otherwise advertise when the
      # user is away from home. See config.example.json for the shape.
      MONITOR_CONFIG: ${{ secrets.MONITOR_CONFIG }}
      # Salts the digests in state.json so the committed file reveals nothing.
      STATE_SALT: ${{ secrets.STATE_SALT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send test notification
        if: inputs.test_notification
        run: python monitor.py --test-notification

      - name: Watch availability and notify
        if: ${{ !inputs.test_notification }}
        timeout-minutes: 35
        run: python monitor.py --watch 29

      - name: Commit updated state
        if: ${{ !inputs.test_notification }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first so this also catches state.json being created by the very
          # first run, which a plain `git diff` would miss as an untracked file.
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "Record notified openings [skip ci]"
          # Another run may have pushed while we were checking.
          git pull --rebase --autostash
          git push
