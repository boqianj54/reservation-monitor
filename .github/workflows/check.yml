name: Check reservation availability

on:
  schedule:
    # Every 5 minutes is the GitHub cron minimum; runs on the free tier are
    # best-effort and can lag by 5-15 minutes under load.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push instead of checking availability"
        type: boolean
        default: false

# Prevent two overlapping runs from racing to commit state.json.
concurrency:
  group: reservation-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_TOPIC: ${{ secrets.APNS_TOPIC }}
      APNS_DEVICE_TOKENS: ${{ secrets.APNS_DEVICE_TOKENS }}
      APNS_ENV: ${{ vars.APNS_ENV || 'sandbox' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send test notification
        if: inputs.test_notification
        run: python monitor.py --test-notification

      - name: Check availability and notify
        if: ${{ !inputs.test_notification }}
        run: python monitor.py

      - name: Commit updated state
        if: ${{ !inputs.test_notification }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first so this also catches state.json being created by the very
          # first run, which a plain `git diff` would miss as an untracked file.
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "Record notified openings [skip ci]"
          # Another run may have pushed while we were checking.
          git pull --rebase --autostash
          git push
